[package]
name = "oxideav-pcx"
version = "0.0.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-pcx"
homepage = "https://github.com/OxideAV/oxideav-pcx"
authors = ["Mark Karpeles"]
description = "Pure-Rust PCX (ZSoft PC Paintbrush) reader/writer for oxideav — clean-room from the PCX 5.0 spec"
readme = "README.md"
keywords = ["multimedia", "image", "pcx", "paintbrush", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# image-library consumers can depend on `oxideav-pcx` with
# `default-features = false` and avoid the framework dependency tree
# entirely. Without `registry` the crate exposes the standalone
# `parse_pcx` / `encode_pcx_8bpp_indexed` / `encode_pcx_24bpp` API plus
# crate-local `PcxImage` / `PcxError` types and never references
# `oxideav-core`.
oxideav-core = { version = "0.1", optional = true }

[features]
default = ["registry"]

# Wires up the codec / encoder / decoder / container demuxer + muxer
# trait implementations against `oxideav-core` so the crate can plug
# into the `oxideav` framework registry. Default-on; turn off for
# image-library use-cases that just want the standalone `parse_pcx`
# API.
registry = ["dep:oxideav-core"]

[dev-dependencies]
# Round 197 (depth-mode benchmarks): Criterion drives the three bench
# harnesses (`decode`, `encode`, `roundtrip`) that future PCX decoder /
# encoder rounds can use to A/B their changes. Pinned to the same 0.5
# line the other OxideAV crates with benches (png / bmp / gif / tiff /
# tta / flac) already track.
criterion = "0.5"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "roundtrip"
harness = false
